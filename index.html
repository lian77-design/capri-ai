<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10051e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>CAPRI AI 3.0 💜</title><style>*{box-sizing:border-box}body{margin:0;background:#08040e;color:#f2e5ff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:550px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(145deg,#1a0b30,#07030e)}header{padding:18px 17px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #9b4cde}h1{margin:0;font-size:22px;letter-spacing:4px;color:#d7a2ff;text-shadow:0 0 15px #b850f9}.online{font-size:11px;color:#cba6ff}.hero{height:39dvh;min-height:230px;max-height:420px;position:relative;overflow:hidden;background:#160821}.hero.listening img{animation:glitch .23s infinite alternate}.hero.talking img{animation:float 1.2s ease-in-out infinite alternate}@keyframes glitch{from{transform:translate(-2px,1px);filter:hue-rotate(9deg) saturate(1.4)}to{transform:translate(2px,-1px);filter:hue-rotate(-8deg) saturate(1.4)}}@keyframes float{to{transform:scale(1.035) translateY(-4px)}}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 35%;filter:saturate(1.12)}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,#10051e 100%);pointer-events:none}.badge{position:absolute;bottom:12px;left:16px;z-index:1;background:#10051ecb;border:1px solid #ae65fa;border-radius:20px;padding:8px 13px;box-shadow:0 0 15px #8424bd}.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bb80ff;box-shadow:0 0 12px #c570ff;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.25}}#log{flex:1;min-height:135px;max-height:29dvh;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}.msg{padding:10px 13px;border-radius:13px;max-width:92%;line-height:1.35}.capri{background:#2c1643;border:1px solid #7333b1;align-self:flex-start}.user{background:#5b2786;align-self:flex-end}.quick{display:flex;gap:7px;padding:5px 12px;overflow-x:auto}.quick button{white-space:nowrap}.controls{display:flex;gap:7px;padding:10px 12px 24px;align-items:center}input{flex:1;min-width:0;padding:13px;border-radius:12px;background:#1e1030;border:1px solid #8851be;color:white;font-size:16px}button{background:#32134d;color:#f2e5ff;border:1px solid #a15af4;border-radius:12px;padding:11px;cursor:pointer}button:active{background:#7438a5}#mic{font-size:23px;min-width:52px}.note{padding:0 15px 8px;color:#ac94c1;font-size:11px;text-align:center}.visualizer{position:absolute;z-index:2;bottom:52px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;height:45px;padding:8px 16px;border-radius:22px;background:#0c0619aa;border:1px solid #a66cff}.visualizer i{width:4px;height:9px;border-radius:4px;background:#d7a2ff;box-shadow:0 0 8px #bd6aff}.hero.listening .visualizer i,.hero.talking .visualizer i{animation:bars .65s ease-in-out infinite alternate}.visualizer i:nth-child(2){animation-delay:.13s!important}.visualizer i:nth-child(3){animation-delay:.26s!important}.visualizer i:nth-child(4){animation-delay:.39s!important}.visualizer i:nth-child(5){animation-delay:.52s!important}@keyframes bars{to{height:33px}}.mini{padding:6px 14px;color:#cfa8ff;font-size:12px;text-align:center}select{background:#28103f;color:#f4e8ff;border:1px solid #9251cb;border-radius:9px;padding:7px;max-width:100%}</style></head><body><div class="app"><header><h1>CAPRI <small>AI</small></h1><span class="online"><span class="pulse"></span> SISTEMA ONLINE</span></header><div class="hero"><img src="capri.jpg" alt="Capri holográfica lilás e preta"><div class="visualizer" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="badge" id="status">💜 Pronta para conversar</div></div><section id="log" aria-live="polite"><div class="msg capri">Oi! Eu sou a Capri 💜 Quer conversar ou abrir algum aplicativo?</div></section><div class="quick"><button onclick="command('Que horas são?')">🕒 Hora</button><button onclick="command('Abrir YouTube')">▶️ YouTube</button><button onclick="command('Abrir Roblox')">🎮 Roblox</button><button onclick="command('Pesquisar')">🔎 Pesquisar</button><button onclick="command('Ajuda')">❔ Ajuda</button></div><div class="quick"><button onclick="command('O que você lembra?')">💾 Memória</button><button onclick="toggleVoice()" id="voiceToggle">🔊 Voz ligada</button><button onclick="command('Como chamar pela Siri?')">📲 Siri</button><button onclick="command('Abrir WhatsApp')">💬 WhatsApp</button></div><div class="mini">🎧 Voz: <select id="voiceSelect" aria-label="Escolher voz"><option value="">Automática (português)</option></select></div><div class="controls"><input id="input" placeholder="Fale comigo..." aria-label="Mensagem"><button id="send">➤</button><button id="mic" aria-label="Falar">🎙️</button></div><div class="note">Versão 3.0 • visualizador animado • voz configurável • memória local • microfone depende do navegador</div></div><script>
const log=document.getElementById('log'),input=document.getElementById('input'),status=document.getElementById('status');let speaking=localStorage.getItem('capri_voice')!=='off';const hero=document.querySelector('.hero');const voiceButton=document.getElementById('voiceToggle');const voiceSelect=document.getElementById('voiceSelect');let voices=[];function loadVoices(){if(!('speechSynthesis' in window))return;voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('pt'));voiceSelect.innerHTML='<option value="">Automática (português)</option>';voices.forEach(v=>{let o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';voiceSelect.appendChild(o)});voiceSelect.value=localStorage.getItem('capri_voice_name')||''}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}voiceSelect.onchange=()=>localStorage.setItem('capri_voice_name',voiceSelect.value);voiceButton.textContent=speaking?'🔊 Voz ligada':'🔇 Voz desligada';function toggleVoice(){speaking=!speaking;localStorage.setItem('capri_voice',speaking?'on':'off');voiceButton.textContent=speaking?'🔊 Voz ligada':'🔇 Voz desligada';if(!speaking&&'speechSynthesis'in window)speechSynthesis.cancel()}function setMode(m){hero.classList.remove('listening','talking');if(m)hero.classList.add(m)}
function add(s,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=s;log.append(d);log.scrollTop=log.scrollHeight}
function say(s){add(s,'capri');status.textContent='💜 Capri está falando';if(!speaking){status.textContent='💜 Pronta para conversar';return}setMode('talking');if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';u.rate=1.04;u.pitch=1.15;const chosen=voices.find(v=>v.name===voiceSelect.value);if(chosen)u.voice=chosen;u.onend=()=>{status.textContent='💜 Pronta para conversar';setMode('')};u.onerror=()=>setMode('');speechSynthesis.speak(u)}else status.textContent='💜 Pronta para conversar'}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function openLink(url,label){say('Vou abrir '+label+' para você.');setTimeout(()=>{window.location.href=url},850)}
function command(raw){const s=raw.trim();if(!s)return;add(s,'user');const q=norm(s);if(q.startsWith('lembre que ')){const fact=s.slice(11).trim();if(!fact)return say('O que você quer que eu lembre?');const facts=JSON.parse(localStorage.getItem('capri_facts')||'[]');facts.push(fact.slice(0,150));localStorage.setItem('capri_facts',JSON.stringify(facts.slice(-20)));return say('Guardei essa informação neste iPhone.')}if(q.includes('o que voce lembra')||q.includes('minhas memorias')){const facts=JSON.parse(localStorage.getItem('capri_facts')||'[]');return say(facts.length?'Eu lembro: '+facts.join('; '):'Ainda não guardei nenhuma informação. Diga: lembre que...')}if(q.includes('apagar memorias')){localStorage.removeItem('capri_facts');return say('Apaguei as informações que você me pediu para guardar.')}if(q.includes('meu nome e ')){const name=s.split(/meu nome é |meu nome e /i)[1]?.trim();if(name&&name!=='...'){localStorage.setItem('capri_name',name.slice(0,50));return say('Prazer, '+name+'! Vou lembrar do seu nome neste aparelho.')}return say('Diga: meu nome é, seguido do seu nome.')}if(q.includes('qual meu nome')||q.includes('sabe meu nome'))return say(localStorage.getItem('capri_name')?'Seu nome é '+localStorage.getItem('capri_name')+'.':'Ainda não sei seu nome. Diga: meu nome é...');if(q.includes('siri')||q.includes('como chamar'))return say('Abra o aplicativo Atalhos do iPhone, crie um atalho chamado Capri com a ação Abrir URL e coloque o endereço HTTPS deste aplicativo depois de publicá-lo. Então diga: E aí Siri, Capri.');if(q.includes('whatsapp'))return openLink('https://wa.me/','WhatsApp');if(q.includes('youtube'))return openLink('https://www.youtube.com','YouTube');if(q.includes('roblox'))return openLink('https://www.roblox.com','Roblox');if(q.includes('spotify'))return openLink('https://open.spotify.com','Spotify');if(q.includes('google')||q.includes('pesquis')||q.includes('busc')){const term=prompt('O que deseja pesquisar?');if(term)return openLink('https://www.google.com/search?q='+encodeURIComponent(term),'a pesquisa');return say('Tudo bem, me diga quando quiser pesquisar.')}if(q.includes('hora'))return say('Agora são '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.');if(q.includes('data')||q.includes('dia e hoje'))return say('Hoje é '+new Date().toLocaleDateString('pt-BR',{dateStyle:'full'})+'.');if(q.includes('oi')||q.includes('ola')||q.includes('capri'))return say('Oi! Estou aqui. O que você precisa?');if(q.includes('obrigad'))return say('Sempre às ordens! 💜');if(q.includes('ajuda')||q.includes('faz'))return say('Posso falar as horas, informar a data, abrir sites, pesquisar e guardar notas quando você disser lembre que. Para consultar, diga o que você lembra. Esta versão ainda não tem IA generativa conectada.');if(q.includes('lembrete')||q.includes('alarme'))return say('Para criar lembretes e alarmes, use a Siri ou o aplicativo Atalhos do iPhone. Ainda não tenho essa integração.');return say('Ainda estou aprendendo! Nesta versão, consigo abrir YouTube, Roblox, Spotify, pesquisar e informar data e hora. Para conversar livremente, precisaremos conectar um serviço de IA.')}
document.getElementById('send').onclick=()=>{const s=input.value;input.value='';command(s)};input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('send').click()}});
document.getElementById('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return say('O reconhecimento de voz não está disponível neste navegador. Use o teclado ou o ditado do iPhone.');const r=new SR();r.lang='pt-BR';r.interimResults=false;r.onstart=()=>{status.textContent='🎙️ Estou ouvindo...';setMode('listening')};r.onerror=()=>{status.textContent='💜 Pronta para conversar';say('Não consegui ouvir. Tente digitar ou usar o ditado do teclado.')};r.onresult=e=>command(e.results[0][0].transcript);r.onend=()=>{status.textContent='💜 Pronta para conversar';setMode('')};try{r.start()}catch(e){say('Não consegui ativar o microfone.')}};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
